<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Mozon GIS · UAE Recharge Map</title>
  <meta name="description" content="Find recharge machines (du, Etisalat, iTunes, Botim & more) across the UAE with building names and surroundings. Search an area like Al Nahda 2 and see the nearest kiosks." />

  <!-- Leaflet map library — bundled locally (only the map background tiles need internet) -->
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <script src="vendor/leaflet.js"></script>

  <style>
    :root{
      --bg:#0f1420; --panel:#151c2c; --panel2:#1b2438; --line:#25304a;
      --text:#e8edf7; --muted:#93a0b8; --accent:#22c3a6; --accent2:#2f7cf6;
      --recharge:#22c3a6; --place:#2f7cf6; --chip:#20293e;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:var(--bg);color:var(--text);overflow:hidden;
    }
    /* Layout: sidebar + map */
    .app{display:grid;grid-template-columns:380px 1fr;height:100vh}
    #map{height:100vh;width:100%;background:#0b1020;z-index:1}

    /* ---- Sidebar ---- */
    .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
    .brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
    .brand h1{margin:0;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
    .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
    .brand p{margin:4px 0 0;color:var(--muted);font-size:12.5px}

    .search{padding:14px 16px 8px;position:relative}
    .search input{
      width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--line);
      background:var(--panel2);color:var(--text);font-size:15px;outline:none;
    }
    .search input:focus{border-color:var(--accent)}
    .search .ico{position:absolute;right:28px;top:26px;color:var(--muted);pointer-events:none}
    .suggest{list-style:none;margin:6px 0 0;padding:0;position:absolute;left:16px;right:16px;
      background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:1200;display:none}
    .suggest li{padding:10px 14px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between}
    .suggest li:hover{background:var(--chip)}
    .suggest li small{color:var(--muted)}

    .tools{display:flex;gap:8px;padding:4px 16px 10px}
    .btn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--text);
      padding:9px;border-radius:10px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
    .btn:hover{border-color:var(--accent)}
    .btn.alt:hover{border-color:var(--accent2)}

    .filters{padding:6px 16px 12px;border-bottom:1px solid var(--line)}
    .filters .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);
      background:var(--chip);color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
    .chip.on{color:#fff;border-color:transparent}

    .listwrap{flex:1;overflow-y:auto;padding:6px 10px 20px}
    .listhead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 8px 6px}
    .listhead h2{font-size:14px;margin:0}
    .listhead span{font-size:12px;color:var(--muted)}

    .card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:8px 6px;cursor:pointer;transition:.15s}
    .card:hover{border-color:var(--accent);transform:translateY(-1px)}
    .card .top{display:flex;justify-content:space-between;gap:8px}
    .card h3{margin:0;font-size:14.5px;line-height:1.25}
    .card .dist{font-size:11px;color:var(--accent);white-space:nowrap;padding-top:2px}
    .card .bld{font-size:12.5px;color:var(--muted);margin:3px 0 8px;display:flex;align-items:center;gap:5px}
    .card .svc{display:flex;flex-wrap:wrap;gap:4px}
    .svc .s{font-size:10.5px;padding:3px 7px;border-radius:6px;color:#fff;font-weight:600}
    .card .around{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4;display:none}
    .card.open .around{display:block}
    .vbadge{display:inline-block;font-size:10px;font-weight:700;color:#3a2c00;background:#F5B301;
      padding:2px 7px;border-radius:20px;vertical-align:middle;white-space:nowrap}

    .empty{color:var(--muted);text-align:center;padding:30px 20px;font-size:14px;line-height:1.6}

    .foot{padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
    .foot b{color:var(--text)}

    /* Popups + markers */
    .pin{display:flex;align-items:center;justify-content:center;border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);border:2px solid #0b1020;box-shadow:0 3px 8px rgba(0,0,0,.4)}
    .pin span{transform:rotate(45deg);font-size:14px}
    .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--text);border-radius:12px}
    .leaflet-popup-tip{background:var(--panel2)}
    .leaflet-popup-content{margin:12px 14px}
    .pop h4{margin:0 0 4px;font-size:15px}
    .pop .pb{color:var(--muted);font-size:12.5px;margin:0 0 8px}
    .pop .svc{margin-bottom:8px}
    .pop .pa{font-size:12px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:8px}
    .pop a.dir{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--accent);text-decoration:none}

    /* Mobile */
    .mtoggle{display:none}
    @media (max-width:820px){
      .app{grid-template-columns:1fr}
      .side{position:fixed;inset:0 0 0 0;z-index:1500;transform:translateY(0);transition:.25s}
      .app.map-mode .side{transform:translateY(calc(100% - 128px))}
      #map{position:fixed;inset:0}
      .mtoggle{display:flex;position:fixed;z-index:1600;right:14px;bottom:150px;
        background:var(--accent);color:#04231d;border:none;border-radius:30px;padding:12px 18px;font-weight:700;
        box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;align-items:center;gap:8px}
      .app.map-mode .listwrap,.app.map-mode .filters{display:none}
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- ---------- Sidebar ---------- -->
    <aside class="side">
      <div class="brand">
        <h1><span class="dot"></span> Mozon GIS · Recharge Map</h1>
        <p>Search any area in all 7 emirates to find the nearest recharge machine — with building names &amp; surroundings.</p>
      </div>

      <div class="search">
        <input id="q" type="text" autocomplete="off" placeholder="Search an area…  e.g. Al Nahda 2" />
        <span class="ico">🔍</span>
        <ul class="suggest" id="suggest"></ul>
      </div>

      <div class="tools">
        <button class="btn" id="btnLocate">📌 Near me</button>
        <button class="btn alt" id="btnAll">🇦🇪 Show all UAE</button>
      </div>

      <div class="filters">
        <div class="lbl">Filter by recharge service</div>
        <div class="chips" id="svcChips"></div>
      </div>

      <div class="listwrap">
        <div class="listhead">
          <h2 id="listTitle">Recharge machines</h2>
          <span id="listCount"></span>
        </div>
        <div id="list"></div>
      </div>

      <div class="foot">
        <b>✓ 6 verified machines</b> + demo samples. Edit <b>data.js</b> to update. ·
        Map © OpenStreetMap contributors
      </div>
    </aside>

    <!-- ---------- Map ---------- -->
    <div id="map"></div>
    <button class="mtoggle" id="mtoggle">☰ List</button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
