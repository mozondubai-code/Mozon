[project]
name = "mozon-broast-mcp"
version = "1.0.0"
description = "MCP server exposing the Mozon Broast menu, order pricing and WhatsApp ordering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
]

[project.scripts]
mozon-broast-mcp = "mozon_broast_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mozon_broast_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
